name: Update Live Playlist
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python merge.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add live.m3u
          git diff --cached --quiet || git commit -m "auto update live.m3u"
          git push
